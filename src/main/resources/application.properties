# ---- Server ----
server.servlet.context-path=/cube

# ---- Oracle DataSource ----
# CUBEDB schema on FCUBS147X - TNS descriptor embedded directly (safest translation
# of a full DESCRIPTION/ADDRESS/CONNECT_DATA block for ojdbc8's thin driver)
spring.datasource.url=jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCP)(HOST=10.20.5.10)(PORT=1521))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=FCUBS147X)))
spring.datasource.username=${DB_USERNAME:cube_user}
spring.datasource.password=${DB_PASSWORD:changeit}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- Microsoft Graph / OneDrive (app-only, client-credentials) ----
# Needs an Azure AD app registration with Files.ReadWrite.All (application
# permission, admin-consented) - a delegated/user token will not work here.
graph.tenant-id=${GRAPH_TENANT_ID:}
graph.client-id=${GRAPH_CLIENT_ID:}
graph.client-secret=${GRAPH_CLIENT_SECRET:}
graph.drive-id=${GRAPH_DRIVE_ID:}
graph.base-folder=${GRAPH_BASE_FOLDER:/CubeKnowledgeCenter}


# ---- Local file storage (testing only - active under spring.profiles.active=local) ----
# Swaps in for OneDrive so attachments are testable through Postman without
# real Azure AD credentials. Never enable this profile outside local/dev.
storage.local.base-dir=${LOCAL_STORAGE_DIR:./local-storage}

# ---- File upload limits ----
# Per-file cap kept in sync with AttachmentService.MAX_FILE_SIZE (10MB).
# max-request-size is higher than max-file-size on purpose - a batch upload
# can contain several files in one multipart request (e.g. 5 files at 10MB
# each = 50MB total), even though no single file may exceed 10MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# ---- Logging ----
logging.level.com.example.cube=INFO