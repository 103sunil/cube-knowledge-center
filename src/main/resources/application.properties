# ---- Server ----
server.servlet.context-path=/cube

# ---- Oracle DataSource ----
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
spring.datasource.username=${DB_USERNAME:cube_user}
spring.datasource.password=${DB_PASSWORD:changeit}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- Elasticsearch ----
spring.elasticsearch.uris=${ES_URIS:http://localhost:9200}

# ---- Logging ----
logging.level.com.example.cube=INFO
